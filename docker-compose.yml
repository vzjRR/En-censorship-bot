services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: enclave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-enclave_dev_password}
      POSTGRES_DB: enclave_rp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enclave -d enclave_rp"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://enclave:${POSTGRES_PASSWORD:-enclave_dev_password}@postgres:5432/enclave_rp
    ports:
      - "3000:3000"

volumes:
  pgdata:
